<!DOCTYPE html>
<html>
<head>
    <title>Add Media</title>
</head>
<body>

    <h1>Add Media</h1>
        {% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Add Media</button>
    </form>

</body>
</html>
