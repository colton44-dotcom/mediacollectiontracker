
<!DOCTYPE html>
<html>
<head>
    <title>Edit Media</title>
</head>
<body>

    <h1>Edit Media: {{ media.title }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'dashboard' %}">Cancel</a>

</body>
</html>
